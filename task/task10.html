<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> -->
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .con {
            width: 90%;
            margin: auto;
            /* background-color: red; */
            min-height: 100vh;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap:20px;
        }
        .card{
            width: 350px;
            height: 350px;
            padding: 15px;
            background-color: wheat;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .card-img-top{
            width: 100px;
            height: 100px;
            
        }
        .card-title{
            font-size: 25px;
        }
        .card-text{
            font-size: 18px;
            margin-bottom: 15px;
        }
        .btn{
            text-decoration: none;
            width: 70px;
            height: 20px;
            background-color: blue;
            padding: 10px 10px;
            /* margin-bottom: 20px; */
            color: whitesmoke;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="con" id = "con">
        <!-- <div class="card">

        </div> -->
    </div>
    <script>

        fetch("https://dummyjson.com/products?limit=15")
            .then(response => response.json())
            .then(data => {

                let text = ''
                console.log(data.products)
                data.products.forEach((value, index, arr) => {
                    text += ` 
                <div class="card" >
                    <img class="card-img-top" src="${value.images[0]}" alt="Card image cap">
                    <div class="card-body">
                        <h5 class="card-title">${value.title}</h5>
                        <p class="card-text">${value.description}</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
                    `
                })
                document.getElementById("con").innerHTML = text;
            }
        
        )
         


    </script>
</body>

</html>
