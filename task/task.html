<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(74, 69, 138)   ;
        }
        .fm{
            width: 150px;
            height: 150px;
            background-color: rgba(42, 40, 116, 0.3);
            box-sizing: border-box;
            opacity: 0.7;
            text-align: left;
            overflow: hidden;
            padding: 10px;
           
        }
        .one {
            font-size: 10px;
            color: whitesmoke;
            margin-bottom: 20px;
        }
        .des {
            font-size: 10px;
            color: whitesmoke;
            line-height: 1.5;
            margin:0;
        }
        .icon{
            font-size: 40px;
            color: whitesmoke;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="fm">
        <span class="img"><i class="fa-solid fa-money-bill"></i></span>
        <h2 class="title one">FINANCE MANAGEMENT</h2>
        <p class="des">
            Secure your business with financial
planning, budgeting, reporting, and
data analysis.
        </p>
        

    </div>

</html>
