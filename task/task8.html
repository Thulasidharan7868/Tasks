<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .form {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ccc;
        }

        form {
            width: 300px;
            height: 400px;
            background-color: #fff;
            padding: 30px;
        }

        button {
            padding: 8px 20px;
            margin-top: 10px;
        }

        #output {
            text-align: center;
            margin-top: -200px;
        }
    </style>
</head>

<body>

    <div class="form">

        <form>
            <label for="name">Name :</label>
            <input type="text" id="name">
            <br><br>

            <label for="email">Email :</label>
            <input type="email" id="email">
            <br><br>

            <label for="age">Age :</label>
            <input type="number" id="age">
            <br><br>

            <button type="button" onclick="login()">Submit</button>
        </form>

    </div>

    <div id="output"></div>

    <script>

        const users = [
            "raja",
            "ravi",
            "jaya",
            "kumar",
            "arun",
            "vijay",
            "suresh",
            "priya",
            "divya",
            "meena"
        ];

        function login() {

            let name = document.getElementById("name").value;

            let user = false;

            for (let i = 0; i < users.length; i++) {

                if (name.toLowerCase() == users[i].toLowerCase()) {
                    user = true;
                    
                }

            }

            if (user) {

                document.getElementById("output").innerHTML =
                    "<h2>Login Successful</h2>" +
                    "<p>Welcome to Eethal Learning</p>";

            } else {

                document.getElementById("output").innerHTML =
                    "<h2>Login Failed</h2>" +
                    "<p>User not found</p>";

            }
        }

    </script>

</body>

</html>
