<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <Style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        nav{
            width:100%;
            height:10vh;
            background-color:rgba(32, 62, 190);
            display: flex;
            position: relative;

        }
        .logo{
            width:300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 400;
            color:white;
            margin-left: 1%;
            
        }
        .ul{
            padding:5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width:700px;
            height: 100%;
            left: auto;
        }
        .li{
            margin-left:20px;
            list-style-type: none;
            padding:5px 15px;
        }
        .link{
            text-decoration: none;
            color: white;
            font-size: 20px;
        }
        .box{
            width:300px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn{
            width:100px;
            height: 40px;
            border-radius: 5px;
            border: none;
            background-color: whitesmoke;
            color:rgba(96, 40, 203);
            font-size: 20px;
        }
        .para1{
            font-size: 50px;
            font-weight: 600;
            text-align: center;
            margin-top: 30px;
        }
        .para2{
            font-size: 30px;
            font-weight: 400;
            text-align: center;
            margin-top: 35px;
        }

    </Style>
</head>
<body>
    <nav>
        <div class="logo">
            NAVBAR
        </div>
        <div>
            <ul class="ul" id = "ul">
            <li class="li"><a href="" class="link">Home</a></li>
            <li class="li"><a href="" class="link">About</a></li>
            <li class="li"><a href="" class="link">Blog</a></li>
            <li class="li"><a href="" class="link">Contact</a></li>
        </ul>
        </div>
        <div class="box">
            <button class="btn">Sign In</button>
            <button class="btn">Sign Up</button>
        </div>
    </nav>
    <p class="para1">Navigation Bar</p>
    <p class="para2">HTML & CSS ONLY</p>    
</body>
</html>
